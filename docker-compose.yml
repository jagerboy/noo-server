services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: noo-server-app
    container_name: noo_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - noo_network

  webserver:
    image: nginx:alpine
    container_name: noo_webserver
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - noo_network

  db:
    image: postgres:16-alpine
    container_name: noo_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-noo_v2_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rootpassword}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    networks:
      - noo_network

networks:
  noo_network:
    driver: bridge

volumes:
  dbdata:
    driver: local
